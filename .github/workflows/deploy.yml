name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The dashboard consumes the core workspace package, so core builds first.
      - run: npm run build -w @angrypacifist/solvent-core

      - run: cd packages/dashboard && npm run build

      - name: ssh setup
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: ship
        run: rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" packages/dashboard/dist/ ubuntu@129.213.54.12:/srv/solvent/
